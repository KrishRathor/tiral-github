# Run review-robo on every pull request (same idea as GitLab: only merge_requests).
# Uses your Docker image; GITHUB_TOKEN is provided automatically by Actions.

name: Code Review

on:
  pull_request:

jobs:
  code_review:
    runs-on: ubuntu-latest
    container:
      image: rathorkrish/review-robo
    env:
      GITHUB_WORKSPACE: /github/workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run review-robo
        run: node /app/dist/index.js
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Optional: send review data to your collector
          MR_REVIEW_COLLECTOR_URL: ${{ secrets.MR_REVIEW_COLLECTOR_URL }}

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: .cursor/reviews/
          retention-days: 7
        if: success()

    permissions:
      contents: read
      pull-requests: write
