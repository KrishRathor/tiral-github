# Run review-robo on every pull request (same idea as GitLab: only merge_requests).
# Uses your Docker image. Pass GH_TOKEN (app expects this; we set it from default GITHUB_TOKEN).
#
# If you see "no matching manifest for linux/amd64", the image was built for another
# arch (e.g. Mac arm64). Rebuild for amd64 and push — see docs/DOCKERHUB-BUILD-AND-RUN.md
# section "Build for GitHub Actions (linux/amd64)".

name: Code Review

on:
  pull_request:

jobs:
  code_review:
    runs-on: ubuntu-latest
    container:
      image: rathorkrish/review-robo
    env:
      GITHUB_WORKSPACE: /github/workspace
      # Job-level env so the container sees these when it starts
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      MR_REVIEW_COLLECTOR_URL: ${{ secrets.MR_REVIEW_COLLECTOR_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run review-robo
        run: node /app/dist/index.js

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: .cursor/reviews/
          retention-days: 7
        if: success()

    permissions:
      contents: read
      pull-requests: write

